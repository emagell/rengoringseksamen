<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rengøringstekniker HF2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">

    <h1>🧹 Rengøringstekniker HF2</h1>

    <h2>Vælg kategori</h2>

    <button onclick="startCategory('hygiene')">
        🦠 Rengøringshygiejne
    </button>

    <button onclick="startCategory('surfaces')">
        🧽 Overflader & Materialer
    </button>

    <button onclick="startCategory('chemistry')">
        🧪 Kemi & pH
    </button>

    <button onclick="startCategory('sanitary')">
        🚽 Sanitetsrengøring
    </button>

    <button onclick="startCategory('machines')">
        🚜 Maskiner & Pads
    </button>

    <button onclick="startCategory('safety')">
        🛡️ Arbejdsmiljø
    </button>

    <button onclick="startCategory('ergonomics')">
        💪 Ergonomi
    </button>

    <button onclick="startCategory('insta')">
        📋 INSTA 800
    </button>

    <button onclick="startCategory('exam')" style="background:#b91c1c;">
        🔥 EKSAMENSMODE
    </button>

</div>

<div id="quiz" style="display:none;">

    <h1 id="categoryTitle"></h1>

    <div class="card">

        <p id="questionCounter"></p>

        <h2 id="question"></h2>

        <div id="options"></div>

        <div id="feedback">

            <p id="result"></p>

            <p id="correctAnswer"></p>

            <p id="explanation"></p>

        </div>

        <button id="nextButton" onclick="nextQuestion()">
            Næste spørgsmål →
        </button>

        <button onclick="backToMenu()">
            Tilbage til menu
        </button>

    </div>

</div>

<script src="questions.js"></script>
<script src="script.js"></script>

</body>
</html>
